<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>PromoFinder v2.3</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0A0A0F; }
    body { font-family: 'DM Sans', system-ui, sans-serif; color: #F0F0F8; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2A2A3A; border-radius: 9999px; }
    * { scrollbar-width: thin; scrollbar-color: #2A2A3A transparent; }
    input, button, select { font-family: inherit; }

    @keyframes scanLine {
      0%   { top: 10%; } 50% { top: 82%; } 100% { top: 10%; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.35; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    @keyframes sheetIn {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes toastIn {
      from { transform: translateX(-50%) translateY(20px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef, useMemo, useCallback } = React;

  // ═══════════════════════════════════════════════════════════════════════════
  // DESIGN TOKENS — satu sistem warna untuk seluruh app
  // ═══════════════════════════════════════════════════════════════════════════
  const C = {
    bg:          "#0A0A0F",
    surface:     "#13131A",
    surfaceHigh: "#1C1C27",
    border:      "#2A2A3A",
    accent:      "#FF3E5E",
    accentDim:   "rgba(255,62,94,0.12)",
    accentGlow:  "rgba(255,62,94,0.28)",
    green:       "#00D68F",
    greenDim:    "rgba(0,214,143,0.12)",
    yellow:      "#FFB800",
    yellowDim:   "rgba(255,184,0,0.12)",
    blue:        "#4D8EFF",
    blueDim:     "rgba(77,142,255,0.10)",
    teal:        "#00E5A0",
    tealDim:     "rgba(0,229,160,0.10)",
    tealGlow:    "rgba(0,229,160,0.22)",
    text:        "#F0F0F8",
    textMuted:   "#6B6B8A",
    textDim:     "#3A3A5C",
    mono:        "'Space Mono', monospace",
  };

  const BRAND_COLOR = {
    "LITTLE M": "#E8455A", "AERO": "#3B82F6",
    "NEVADA": "#10B981", "NEVADA GIRLS": "#A855F7", "NEVADA BOYS": "#F59E0B",
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // STORAGE KEYS
  // ═══════════════════════════════════════════════════════════════════════════
  const SK_DATA     = "promofinder_data";
  const SK_HIST     = "promofinder_history";
  const SK_SESSIONS = "promofinder_sessions";
  const SK_EANMAP   = "ean_sku_map_v1";
  const SK_EANHIST  = "ean_sku_hist_v1";
  const SK_AUTH     = "pf_auth_v1";       // { adminPin, userPin }
  const SK_SESSION  = "pf_session_v1";    // { role, ts } — sesi aktif
  const SK_THEME    = "pf_theme_v1";      // { appName, emoji, accent }
  const SK_DRIVE    = "pf_drive_v1";      // Google Drive direct-download URL

  const store = {
    get: (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
    set: (k, v)  => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // FORMATTERS & UTILS
  // ═══════════════════════════════════════════════════════════════════════════
  const IDR    = new Intl.NumberFormat("id-ID", { style:"currency", currency:"IDR", maximumFractionDigits:0 });
  const fmt    = n => IDR.format(n);
  const today  = () => new Date().toISOString().split("T")[0];
  const fmtDate= d => { try { return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); } catch { return "—"; } };

  function parseDescription(desc) {
    const p = String(desc||"").split(":");
    return { product_name:(p[0]||"").trim(), color:(p[1]||"").trim(), size:(p[2]||"").trim() };
  }
  function excelDateToISO(val) {
    if (!val) return null;
    if (val instanceof Date) return val.toISOString().split("T")[0];
    if (typeof val==="string"&&val.includes("-")) return val.split("T")[0];
    return new Date(Math.round((val-25569)*86400*1000)).toISOString().split("T")[0];
  }
  function isActivePromo(item) {
    if (!item.from_date||!item.to_date) return true;
    const now = today(); return now>=item.from_date&&now<=item.to_date;
  }
  function isValidEAN13(s) {
    if (!/^\d{13}$/.test(s)) return false;
    const d = s.split("").map(Number);
    const sum = d.slice(0,12).reduce((a,v,i)=>a+v*(i%2===0?1:3),0);
    return (10-(sum%10))%10===d[12];
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PROMO LOGIC
  // ═══════════════════════════════════════════════════════════════════════════
  const COLUMN_ALIASES = {
    "ACARA":       ["ACARA","EVENT","PROMO","NAMA PROMO","NAMA EVENT","KETERANGAN"],
    "FROM DATE":   ["FROM DATE","FROM","DARI","DARI TANGGAL","START DATE","TGL MULAI","MULAI","DATE FROM","TANGGAL MULAI"],
    "TO DATE":     ["TO DATE","TO","SAMPAI","SAMPAI TANGGAL","END DATE","TGL AKHIR","AKHIR","DATE TO","TANGGAL AKHIR"],
    "DEPT":        ["DEPT","DEPARTMENT","DEP","DEPARTEMEN"],
    "WORLD":       ["WORLD","WORLD CODE"],
    "DIVISION":    ["DIVISION","DIV","DIVISI"],
    "CLASS":       ["CLASS","KELAS"],
    "SUPPLIER":    ["SUPPLIER","VENDOR","SUP"],
    "BRAND":       ["BRAND","MERK","MEREK"],
    "SKU":         ["SKU","KODE SKU","SKU CODE","ITEM CODE","ITEM NO"],
    "EAN":         ["EAN","EAN13","EAN-13","BARCODE","KODE BARCODE","UPC","PLU","KODE TOKO"],
    "ARTICLE":     ["ARTICLE","ARTIKEL","KODE ARTIKEL","ARTICLE CODE","ART"],
    "DESCRIPTION": ["DESCRIPTION","DESKRIPSI","DESC","NAMA PRODUK","PRODUCT NAME","KETERANGAN PRODUK"],
    "HARGA NORMAL":["HARGA NORMAL","NORMAL PRICE","HARGA ASLI","HARGA","PRICE","ORIGINAL PRICE","HRG NORMAL","HARGA ORG","HARGA ORIGINAL"],
    "DISKON":      ["DISKON","DISCOUNT","DISC","POTONGAN","%DISC","DISC%","PERSEN DISKON","% DISC"],
    "HARGA PROMO": ["HARGA PROMO","PROMO PRICE","HARGA SETELAH DISKON","HARGA DISC","HRG PROMO","FINAL PRICE","SELLING PRICE"],
    "DISCOUNT TYPE":["DISCOUNT TYPE","TIPE DISKON","TYPE","JENIS DISKON","DISC TYPE"],
  };
  const normalizeCol = s => String(s).toUpperCase().replace(/\s+/g," ").trim();
  function buildColumnMap(cols) {
    const map={}, norm=cols.map(c=>({original:c,normalized:normalizeCol(c)}));
    for (const [std,aliases] of Object.entries(COLUMN_ALIASES)) {
      const na=aliases.map(normalizeCol);
      for (const {original,normalized} of norm) { if(na.includes(normalized)){map[std]=original;break;} }
    }
    return map;
  }
  function getVal(row,colMap,std,fb="") {
    const col=colMap[std]; if(!col) return fb;
    const v=row[col]; return v===undefined||v===null?fb:v;
  }
  function detectPromoType(dk,hp,dt,ac) {
    const D=String(dt||"").toUpperCase().trim(), H=String(hp||"").toUpperCase().trim();
    const K=String(dk||"").toUpperCase().trim(), A=String(ac||"").toUpperCase();
    if(H.includes("B1G2")||K.includes("B1G2")||D.includes("B1G2")||A.includes("B1G2")) return "B1G2";
    if(H.includes("B1G1")||K.includes("B1G1")||D.includes("B1G1")||A.includes("B1G1")) return "B1G1";
    if(D.includes("BXGY")||K.includes("BXGY")||H.includes("BXGY")) return A.includes("1G2")?"B1G2":"B1G1";
    if(D==="SPECIAL PRICE"||K==="SP") return "SPECIAL_PRICE";
    if(D==="PERCENTAGE") return "PERCENTAGE";
    if(D==="AMOUNT") return "AMOUNT";
    return "PERCENTAGE";
  }
  function parseHargaPromo(dk,hp,normal,pt) {
    if(pt==="B1G1"||pt==="B1G2") return normal;
    if(typeof hp==="string"&&hp.startsWith("=")) { const d=parseFloat(dk)||0; return d>0&&d<=1?Math.round(normal*(1-d)):normal; }
    if(typeof hp==="number"&&hp>0) return hp;
    const s=String(hp||"").toUpperCase().trim(); if(!s) return normal;
    if(s.includes("NORMAL")||s.includes("B1G")||s.includes("BXGY")||s.includes("SP")) return normal;
    if(/^[A-Z]/.test(s)) return normal;
    const n=parseFloat(s.replace(/[^0-9.]/g,"")); return isNaN(n)||n===0?normal:n;
  }
  function getPromoLabel(item) {
    const pt=item.promo_type;
    if(pt==="B1G1") return {label:"BELI 1 GRATIS 1",color:"#A855F7",bg:"rgba(168,85,247,0.12)",border:"rgba(168,85,247,0.3)"};
    if(pt==="B1G2") return {label:"BELI 1 GRATIS 2",color:"#EC4899",bg:"rgba(236,72,153,0.12)",border:"rgba(236,72,153,0.3)"};
    if(pt==="SPECIAL_PRICE") return {label:"SPECIAL PRICE",color:C.blue,bg:C.blueDim,border:"rgba(77,142,255,0.3)"};
    if(pt==="PERCENTAGE"&&item.diskon>0) return {label:`OFF ${Math.round(item.diskon*100)}%`,color:C.yellow,bg:C.yellowDim,border:`${C.yellow}33`};
    if(pt==="AMOUNT"&&item.harga_promo<item.harga_normal) return {label:`HEMAT ${fmt(item.harga_normal-item.harga_promo)}`,color:C.yellow,bg:C.yellowDim,border:`${C.yellow}33`};
    return null;
  }

  function parseExcelFile(file) {
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=e=>{
        try {
          const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
          const allRows=[],sheetErrors=[],sheetSkipped=[];
          for (const sheetName of wb.SheetNames) {
            const ws=wb.Sheets[sheetName];
            const raw=XLSX.utils.sheet_to_json(ws,{defval:""});
            if(raw.length===0) continue;
            const colMap=buildColumnMap(Object.keys(raw[0]));
            if(!colMap["SKU"]||!colMap["HARGA NORMAL"]) {
              sheetSkipped.push(`"${sheetName}" (tidak ada kolom: ${["SKU","HARGA NORMAL"].filter(k=>!colMap[k]).join(", ")})`);
              continue;
            }
            raw.forEach((row,idx)=>{
              const skuRaw=String(getVal(row,colMap,"SKU","")).replace(/[^0-9]/g,"");
              if(!skuRaw||skuRaw.length<6) return;
              const fromDate=excelDateToISO(getVal(row,colMap,"FROM DATE",null));
              const toDate=excelDateToISO(getVal(row,colMap,"TO DATE",null));
              const hargaNormal=parseInt(getVal(row,colMap,"HARGA NORMAL",0))||0;
              const diskonRaw=getVal(row,colMap,"DISKON",0);
              const hargaPromoRaw=getVal(row,colMap,"HARGA PROMO",hargaNormal);
              const discTypeRaw=getVal(row,colMap,"DISCOUNT TYPE","");
              const acaraVal=String(getVal(row,colMap,"ACARA",sheetName)).trim()||sheetName;
              const promoType=detectPromoType(diskonRaw,hargaPromoRaw,discTypeRaw,acaraVal);
              const hargaPromo=parseHargaPromo(diskonRaw,hargaPromoRaw,hargaNormal,promoType);
              const descRaw=getVal(row,colMap,"DESCRIPTION","");
              const parsed=parseDescription(descRaw);
              allRows.push({
                _errors:[], _sheet:sheetName, _row:idx+2,
                sku:skuRaw,
                article:String(getVal(row,colMap,"ARTICLE","")).trim(),
                brand:String(getVal(row,colMap,"BRAND","")).trim().toUpperCase()||"UNKNOWN",
                product_name:parsed.product_name, color:parsed.color, size:parsed.size,
                description:String(descRaw),
                harga_normal:hargaNormal,
                diskon:parseFloat(getVal(row,colMap,"DISKON",0))||0,
                harga_promo:hargaPromo, promo_type:promoType,
                discount_type:String(getVal(row,colMap,"DISCOUNT TYPE","PERCENTAGE")).trim(),
                from_date:fromDate, to_date:toDate, acara:acaraVal,
                dept:parseInt(getVal(row,colMap,"DEPT",0))||0,
                world:parseInt(getVal(row,colMap,"WORLD",0))||0,
                ean:String(getVal(row,colMap,"EAN","")).replace(/[^0-9]/g,""),
              });
            });
          }
          resolve({rows:allRows,sheetErrors,sheetSkipped});
        } catch(err) { reject(new Error("File tidak bisa dibaca: "+err.message)); }
      };
      reader.onerror=()=>reject(new Error("Gagal membaca file"));
      reader.readAsArrayBuffer(file);
    });
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // EAN-MAP UTILS
  // ═══════════════════════════════════════════════════════════════════════════
  function exportEanJSON(mapping) {
    const blob=new Blob([JSON.stringify(mapping,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`ean-sku-map-${today()}.json`; a.click();
  }
  function exportEanXLSX(mapping) {
    const rows=Object.entries(mapping).map(([ean,e])=>({EAN13:ean,SKU:e.sku,DESKRIPSI:e.desc||"",TANGGAL:e.date||""}));
    const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"EAN-SKU");
    XLSX.writeFile(wb,`ean-sku-map-${today()}.xlsx`);
  }
  function importEanXLSX(file) {
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=e=>{
        try {
          const wb=XLSX.read(e.target.result,{type:"array"});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
          const map={};
          rows.forEach(row=>{
            const ean=String(row["EAN13"]||row["EAN"]||row["BARCODE"]||"").replace(/\D/g,"");
            const sku=String(row["SKU"]||row["KODE SKU"]||"").replace(/\D/g,"");
            if(ean.length>=8&&sku.length>=4) map[ean]={sku,desc:String(row["DESKRIPSI"]||""),date:today()};
          });
          resolve(map);
        } catch(err) { reject(err); }
      };
      reader.onerror=()=>reject(new Error("Gagal baca file"));
      reader.readAsArrayBuffer(file);
    });
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // SHARED CAMERA OVERLAY
  // ═══════════════════════════════════════════════════════════════════════════
  function CameraOverlay({ active, label, videoRef, onStop }) {
    if (!active) return null;
    return (
      <div style={{
        position:"fixed",inset:0,background:"rgba(0,0,0,0.94)",
        zIndex:1000,display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"center",padding:24,
      }}>
        <div style={{width:"100%",maxWidth:400}}>
          <div style={{fontSize:11,color:C.teal,fontWeight:700,textAlign:"center",marginBottom:10,letterSpacing:"0.08em"}}>
            {label}
          </div>
          <div style={{position:"relative",borderRadius:16,overflow:"hidden",background:"#000"}}>
            <video ref={videoRef} autoPlay playsInline muted
              style={{width:"100%",maxHeight:260,objectFit:"cover",display:"block"}}/>
            <div style={{
              position:"absolute",left:"10%",right:"10%",height:2,
              background:`linear-gradient(90deg,transparent,${C.teal},transparent)`,
              boxShadow:`0 0 10px ${C.tealGlow}`,
              animation:"scanLine 2s ease-in-out infinite",pointerEvents:"none",
            }}/>
            {[[0,0],[0,1],[1,0],[1,1]].map(([r,c],i)=>(
              <div key={i} style={{
                position:"absolute",
                top:r===0?"8%":"auto",bottom:r===1?"8%":"auto",
                left:c===0?"7%":"auto",right:c===1?"7%":"auto",
                width:22,height:22,
                borderTop:r===0?`2px solid ${C.teal}`:"none",
                borderBottom:r===1?`2px solid ${C.teal}`:"none",
                borderLeft:c===0?`2px solid ${C.teal}`:"none",
                borderRight:c===1?`2px solid ${C.teal}`:"none",
                pointerEvents:"none",
              }}/>
            ))}
            <div style={{
              position:"absolute",bottom:8,left:0,right:0,textAlign:"center",
              fontSize:11,color:C.teal,fontWeight:700,
              animation:"pulse 1.5s ease-in-out infinite",pointerEvents:"none",
            }}>● Mendeteksi barcode…</div>
          </div>
          <button onClick={onStop} style={{
            marginTop:16,width:"100%",padding:13,borderRadius:12,
            background:"rgba(255,255,255,0.05)",border:`1px solid ${C.border}`,
            color:C.textMuted,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit",
          }}>✕ Tutup Kamera</button>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // TOAST
  // ═══════════════════════════════════════════════════════════════════════════
  function Toast({ toast }) {
    if (!toast) return null;
    const clr = toast.type==="err"?C.accent:toast.type==="warn"?C.yellow:C.teal;
    const bg  = toast.type==="err"?"rgba(255,62,94,0.12)":toast.type==="warn"?C.yellowDim:C.tealDim;
    return (
      <div style={{
        position:"fixed",bottom:80,left:"50%",
        transform:"translateX(-50%)",
        background:bg,border:`1px solid ${clr}55`,
        borderRadius:12,padding:"11px 20px",fontSize:13,fontWeight:700,
        color:clr,zIndex:9999,whiteSpace:"nowrap",
        animation:"toastIn 0.2s ease",
        boxShadow:"0 8px 32px rgba(0,0,0,0.5)",
      }}>{toast.msg}</div>
    );
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // SHARED SUBCOMPONENTS
  // ═══════════════════════════════════════════════════════════════════════════
  function BrandPill({brand}) {
    const bg=BRAND_COLOR[brand]||C.blue;
    return <span style={{background:bg+"22",color:bg,border:`1px solid ${bg}44`,fontSize:"10px",fontWeight:700,padding:"2px 8px",borderRadius:9999,letterSpacing:"0.06em",textTransform:"uppercase",flexShrink:0}}>{brand}</span>;
  }
  function StatusPill({active}) {
    return <span style={{background:active?C.greenDim:"rgba(255,62,94,0.1)",color:active?C.green:C.accent,border:`1px solid ${active?C.green:C.accent}44`,fontSize:"10px",fontWeight:700,padding:"2px 10px",borderRadius:9999}}>{active?"● AKTIF":"○ BERAKHIR"}</span>;
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PROMO CARD
  // ═══════════════════════════════════════════════════════════════════════════
  function PromoCard({item,onClick}) {
    const active=isActivePromo(item);
    const promoInfo=getPromoLabel(item);
    const pt=item.promo_type,isBxGy=pt==="B1G1"||pt==="B1G2";
    const brandClr=BRAND_COLOR[item.brand]||C.blue;
    return (
      <div onClick={()=>onClick(item)} style={{
        background:C.surface,border:`1px solid ${C.border}`,
        borderLeft:`3px solid ${brandClr}`,borderRadius:10,
        padding:"14px 16px",cursor:"pointer",transition:"all 0.15s",
        display:"flex",flexDirection:"column",gap:8,animation:"fadeUp 0.2s ease",
      }}
        onMouseEnter={e=>{e.currentTarget.style.background=C.surfaceHigh;e.currentTarget.style.borderColor=brandClr;}}
        onMouseLeave={e=>{e.currentTarget.style.background=C.surface;e.currentTarget.style.borderColor=C.border;e.currentTarget.style.borderLeftColor=brandClr;}}
      >
        <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
          <div style={{fontWeight:700,fontSize:13,color:C.text,lineHeight:1.35,flex:1}}>{item.product_name}</div>
          <BrandPill brand={item.brand}/>
        </div>
        <div style={{fontSize:11,color:C.textMuted}}>{item.color}{item.size?` · Size ${item.size}`:""}</div>
        <div style={{fontFamily:"monospace",fontSize:10,color:C.textDim}}>SKU {item.sku} · {item.article}</div>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          {isBxGy?(
            <>
              <span style={{fontWeight:900,fontSize:16,color:C.text}}>{fmt(item.harga_normal)}</span>
              <span style={{background:promoInfo.bg,color:promoInfo.color,border:`1px solid ${promoInfo.border}`,fontSize:11,fontWeight:800,padding:"3px 10px",borderRadius:9999}}>{promoInfo.label} 🎁</span>
            </>
          ):promoInfo?(
            <>
              <span style={{textDecoration:"line-through",color:C.textMuted,fontSize:12}}>{fmt(item.harga_normal)}</span>
              <span style={{fontWeight:900,fontSize:18,color:promoInfo.color}}>{fmt(item.harga_promo)}</span>
              <span style={{background:promoInfo.bg,color:promoInfo.color,border:`1px solid ${promoInfo.border}`,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:9999}}>{promoInfo.label}</span>
            </>
          ):(
            <span style={{fontWeight:800,fontSize:18,color:C.green}}>{fmt(item.harga_promo)}<span style={{fontSize:11,fontWeight:400,color:C.textMuted,marginLeft:6}}>Normal</span></span>
          )}
          {!active&&<StatusPill active={false}/>}
        </div>
      </div>
    );
  }

    const boxBorder=promoInfo?promoInfo.border:`${C.green}33`;

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>

            <button onClick={onClose} style={{background:C.surfaceHigh,border:`1px solid ${C.border}`,borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:14,color:C.textMuted}}>✕</button>
          </div>
          <h2 style={{fontSize:20,fontWeight:900,color:C.text,marginBottom:4,lineHeight:1.3}}>{item.product_name}</h2>
          <p style={{color:C.textMuted,fontSize:14,marginBottom:20}}>{item.color}{item.size?` · Size ${item.size}`:""}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {[["SKU",item.sku,true],["ARTICLE",item.article,true],["PERIODE",`${fmtDate(item.from_date)} – ${fmtDate(item.to_date)}`,false],["EVENT",item.acara,false]].map(([label,val,mono])=>(
              <div key={label} style={{background:C.surfaceHigh,borderRadius:10,padding:12,border:`1px solid ${C.border}`}}>
                <div style={{fontSize:10,fontWeight:700,color:C.textMuted,letterSpacing:"0.08em",marginBottom:4}}>{label}</div>
                <div style={{fontSize:13,fontWeight:700,color:C.text,fontFamily:mono?"monospace":"inherit",wordBreak:"break-all"}}>{val}</div>
              </div>
            ))}
          </div>
          <div style={{background:boxBg,border:`1px solid ${boxBorder}`,borderRadius:14,padding:20,marginBottom:20}}>
            {isBxGy?(
              <div>
                <div style={{textAlign:"center",marginBottom:14}}>
                  <div style={{display:"inline-block",background:boxColor+"22",border:`2px solid ${boxColor}`,borderRadius:12,padding:"10px 22px"}}>
                    <div style={{fontSize:22,fontWeight:900,color:boxColor,letterSpacing:"0.04em"}}>{promoInfo.label}</div>
                  </div>
                </div>
                <div style={{borderTop:`1px dashed ${C.border}`,paddingTop:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                    <span style={{color:C.textMuted,fontSize:13}}>Harga per item (bayar)</span>
                    <span style={{fontWeight:700,fontSize:14,color:C.text}}>{fmt(item.harga_normal)}</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontWeight:700,color:C.text,fontSize:13}}>{pt==="B1G2"?"Gratis 2 item lagi":"Gratis 1 item lagi"}</span>
                    <span style={{fontWeight:900,fontSize:22,color:boxColor}}>{pt==="B1G2"?"FREE ×2 🎁":"FREE ×1 🎁"}</span>
                  </div>

              </div>
            ):(
              <div>
                {promoInfo&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{color:C.textMuted,fontSize:13}}>Harga Normal</span><span style={{color:C.textMuted,fontSize:14,textDecoration:"line-through"}}>{fmt(item.harga_normal)}</span></div>}
                {promoInfo&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}><span style={{color:C.textMuted,fontSize:13}}>Promo</span><span style={{color:boxColor,fontWeight:800}}>{promoInfo.label}</span></div>}

  // ═══════════════════════════════════════════════════════════════════════════
  // TAB: CARI PROMO
  // ═══════════════════════════════════════════════════════════════════════════
  const PAGE_SIZE=50;
  function SearchTab({data,showToast,dynC:dC}) {
    const dynC = dC || C;
    const [query,setQuery]       = useState("");
    const [debouncedQ,setDQ]     = useState("");
    const [brandF,setBrandF]     = useState("Semua");
    const [onlyActive,setOnlyA]  = useState(false);
    const [selected,setSelected] = useState(null);
    const [scanMode,setScanMode] = useState(false);
    const [scanInput,setScanInput]= useState("");
    const [scanHist,setScanHist] = useState(()=>store.get(SK_HIST,[]));
    const [page,setPage]         = useState(1);
    const [camActive,setCamActive]= useState(false);
    const inputRef=useRef(),scanRef=useRef(),videoRef=useRef(),readerRef=useRef(null),debRef=useRef();

    useEffect(()=>{ clearTimeout(debRef.current); debRef.current=setTimeout(()=>{setDQ(query);setPage(1);},300); return()=>clearTimeout(debRef.current); },[query]);
    useEffect(()=>{setPage(1);},[brandF,onlyActive]);

    useEffect(()=>{
      const skuIdx=new Map(data.map(d=>[d.sku,d]));
      const artIdx=new Map(),eanIdx=new Map();
      data.forEach(d=>{
        if(!artIdx.has(d.article))artIdx.set(d.article,[]);
        artIdx.get(d.article).push(d);
        if(d.ean&&d.ean.length>=8)eanIdx.set(d.ean,d);
      });
      window.__promoIndex={sku:skuIdx,article:artIdx,ean:eanIdx};
    },[data]);

    useEffect(()=>{ const h=e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();inputRef.current?.focus();}if(e.key==="F2"){e.preventDefault();setScanMode(true);}if(e.key==="Escape"){setSelected(null);setScanMode(false);}};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[]);
    useEffect(()=>{if(scanMode)setTimeout(()=>scanRef.current?.focus(),100);else stopCamera();},[scanMode]);

    const brands=useMemo(()=>["Semua",...Array.from(new Set(data.map(d=>d.brand))).sort()],[data]);
    const filtered=useMemo(()=>{const q=debouncedQ.toLowerCase().trim();return data.filter(item=>{const mb=brandF==="Semua"||item.brand===brandF;const ma=!onlyActive||isActivePromo(item);const mq=!q||item.sku.includes(q)||(item.article||"").toLowerCase().includes(q)||(item.product_name||"").toLowerCase().includes(q)||(item.color||"").toLowerCase().includes(q);return mb&&ma&&mq;});},[data,debouncedQ,brandF,onlyActive]);
    const visible=useMemo(()=>filtered.slice(0,page*PAGE_SIZE),[filtered,page]);
    const activeCount=useMemo(()=>data.filter(isActivePromo).length,[data]);

    function handleSelect(item){setSelected(item);const next=[item,...scanHist.filter(h=>h.sku!==item.sku)].slice(0,8);setScanHist(next);store.set(SK_HIST,next);}

    function lookupByEAN(raw){
      const idx=window.__promoIndex; if(!idx) return null;
      const byE=idx.ean?.get(raw); if(byE) return byE;
      if(raw.length===13){const m=idx.sku.get(raw.slice(3,11));if(m)return m;const m2=idx.sku.get(raw.slice(4,12));if(m2)return m2;}
      for(let n=6;n<=10;n++){const s=raw.slice(-n-1,raw.length-1);const bS=Array.from(idx.sku.values()).find(d=>d.sku.endsWith(s)&&s.length===d.sku.length);if(bS)return bS;}
      return null;
    }

    function handleScan(){
      const q=scanInput.trim().replace(/[^0-9A-Za-z]/g,"");
      const idx=window.__promoIndex;
      const found=idx?.sku?.get(q);
      if(found){handleSelect(found);setScanMode(false);setScanInput("");return;}
      if(/^[0-9]{8,14}$/.test(q)){const be=lookupByEAN(q);if(be){handleSelect(be);setScanMode(false);setScanInput("");return;}}
      const partial=data.find(d=>d.sku.endsWith(q)||d.article===q.toUpperCase());
      if(partial){handleSelect(partial);setScanMode(false);setScanInput("");return;}
      showToast(`"${q}" tidak ditemukan`,"err");
    }

    function stopCamera(){if(readerRef.current){try{readerRef.current.reset();}catch{}readerRef.current=null;}setCamActive(false);}
    function startCamera(){if(!window.ZXing){showToast("ZXing belum siap","err");return;}setCamActive(true);}

    useEffect(()=>{
      if(!camActive||!videoRef.current)return;
      const ZX=window.ZXing; if(!ZX){setCamActive(false);return;}
      const reader=new ZX.BrowserMultiFormatReader(); readerRef.current=reader;
      reader.decodeFromVideoDevice(undefined,videoRef.current,(result)=>{
        if(!result)return;
        const raw=result.getText().replace(/[^0-9]/g,""); if(!raw)return;
        reader.reset();readerRef.current=null;setCamActive(false);
        const found=window.__promoIndex?.sku?.get(raw);
        if(found){handleSelect(found);setScanMode(false);setScanInput("");return;}
        if(/^[0-9]{8,14}$/.test(raw)){const be=lookupByEAN(raw);if(be){handleSelect(be);setScanMode(false);setScanInput("");return;}}
        const partial=data.find(d=>d.sku.endsWith(raw)||d.article===raw.toUpperCase());
        if(partial){handleSelect(partial);setScanMode(false);setScanInput("");return;}
        setScanInput(raw);
      }).catch(()=>setCamActive(false));
      return()=>{try{reader.reset();}catch{}readerRef.current=null;};
    },[camActive]);

    return (
      <>
        <CameraOverlay active={camActive} label="SCAN BARCODE / EAN-13" videoRef={videoRef} onStop={stopCamera}/>

        {/* Sticky search header */}
        <div style={{position:"sticky",top:0,zIndex:100,background:C.bg,paddingBottom:10}}>
          <div style={{padding:"0 16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:11,color:C.textMuted}}>
                <span style={{color:C.green,fontWeight:700}}>{activeCount}</span> aktif &nbsp;·&nbsp;
                <span>{data.length} SKU</span>
              </div>
              <button onClick={()=>setScanMode(true)} style={{background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"7px 14px",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit",boxShadow:`0 2px 12px ${C.accentGlow}`}}>
                📷 SCAN <kbd style={{opacity:0.7,fontSize:10}}>F2</kbd>
              </button>
            </div>
            <div style={{position:"relative"}}>
              <span style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",color:C.textMuted,pointerEvents:"none"}}>🔍</span>
              <input ref={inputRef} value={query} onChange={e=>setQuery(e.target.value)}
                placeholder="Cari SKU, artikel, nama produk…  (/)"
                style={{width:"100%",padding:"12px 38px",borderRadius:10,background:C.surface,border:`1px solid ${query?C.accent+"66":C.border}`,color:C.text,fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit",transition:"border-color 0.15s"}}/>
              {query&&<button onClick={()=>setQuery("")} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.textMuted,cursor:"pointer",fontSize:15}}>✕</button>}
            </div>
          </div>
          <div style={{display:"flex",gap:6,padding:"10px 16px 0",overflowX:"auto",scrollbarWidth:"none"}}>
            {brands.map(b=>{const clr=BRAND_COLOR[b],isActive=brandF===b;return(
              <button key={b} onClick={()=>setBrandF(b)} style={{padding:"5px 12px",borderRadius:9999,border:`1px solid ${isActive?(clr||C.accent):C.border}`,background:isActive?(clr||C.accent):C.surface,color:isActive?"#fff":C.textMuted,fontWeight:isActive?700:500,fontSize:11,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,fontFamily:"inherit",transition:"all 0.15s"}}>{b}</button>
            );})}
            <button onClick={()=>setOnlyA(p=>!p)} style={{padding:"5px 12px",borderRadius:9999,background:onlyActive?C.greenDim:C.surface,color:onlyActive?C.green:C.textMuted,border:`1px solid ${onlyActive?C.green+"66":C.border}`,fontWeight:onlyActive?700:500,fontSize:11,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,fontFamily:"inherit"}}>● Aktif saja</button>
          </div>
        </div>

        <div style={{padding:"12px 16px",display:"flex",flexDirection:"column",gap:10,paddingBottom:90}}>
          {/* Riwayat scan */}
          {!query&&scanHist.length>0&&(
            <div>
              <div style={{fontSize:10,fontWeight:700,color:C.textMuted,letterSpacing:"0.08em",marginBottom:8}}>RIWAYAT SCAN</div>
              <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4,scrollbarWidth:"none"}}>
                {scanHist.map(h=>(
                  <div key={h.sku} onClick={()=>handleSelect(h)} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",cursor:"pointer",flexShrink:0,minWidth:140}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent+"66"}
                    onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                    <div style={{fontSize:10,color:C.textMuted,fontFamily:"monospace"}}>{h.sku}</div>
                    <div style={{fontSize:12,fontWeight:700,color:C.text,marginTop:2}}>{h.product_name?.length>22?h.product_name.slice(0,22)+"…":h.product_name}</div>
                    <div style={{fontSize:13,fontWeight:900,color:getPromoLabel(h)?C.accent:C.green,marginTop:4}}>{fmt(h.harga_promo)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {data.length>0&&<div style={{fontSize:11,color:C.textMuted}}>{filtered.length.toLocaleString()} SKU{query?` untuk "${debouncedQ}"`:""}{filtered.length>PAGE_SIZE&&<span style={{color:C.textDim}}> · tampil {visible.length}</span>}</div>}

          {data.length===0&&(
            <div style={{textAlign:"center",padding:"60px 20px"}}>
              <div style={{fontSize:48,marginBottom:16}}>📂</div>
              <div style={{fontWeight:700,color:C.text,fontSize:16,marginBottom:8}}>Belum ada data promo</div>
              <div style={{color:C.textMuted,fontSize:13}}>Buka tab Upload untuk import file Excel.</div>
            </div>
          )}
          {data.length>0&&filtered.length===0&&(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:36,marginBottom:12}}>🔍</div>
              <div style={{fontWeight:700,color:C.text}}>Tidak ditemukan</div>
              <div style={{color:C.textMuted,fontSize:12,marginTop:4}}>Coba SKU, artikel, atau nama produk lain</div>
            </div>
          )}

          {visible.map(item=><PromoCard key={item.sku} item={item} onClick={handleSelect}/>)}

          {visible.length<filtered.length&&(
            <button onClick={()=>setPage(p=>p+1)} style={{width:"100%",padding:14,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.textMuted,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=C.accent+"66";e.currentTarget.style.color=C.text;}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.textMuted;}}>
              Muat {Math.min(PAGE_SIZE,filtered.length-visible.length)} lagi
              <span style={{color:C.textDim,marginLeft:6}}>({filtered.length-visible.length} tersisa)</span>
            </button>
          )}
        </div>

        {/* Scan modal */}
        {scanMode&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:400,padding:24,backdropFilter:"blur(8px)"}}>
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:20,padding:"28px 24px",width:"100%",maxWidth:340,textAlign:"center"}}>
              <div style={{fontSize:36,marginBottom:10}}>📷</div>
              <div style={{fontWeight:900,color:C.text,fontSize:18,marginBottom:6}}>Scan / Ketik SKU</div>
              <div style={{color:C.textMuted,fontSize:12,marginBottom:14}}>Scan EAN-13 atau ketik SKU internal (8 digit)</div>
              <div style={{background:C.blueDim,border:`1px solid ${C.blue}33`,borderRadius:8,padding:"8px 12px",marginBottom:14,textAlign:"left"}}>
                <div style={{fontSize:11,color:C.blue,fontWeight:700,marginBottom:3}}>💡 Dua cara input:</div>
                <div style={{fontSize:10,color:C.textMuted,lineHeight:1.5}}>
                  <span style={{color:C.text}}>① SKU internal</span> — 8 digit dari label (mis: <span style={{fontFamily:"monospace",color:C.green}}>68071923</span>)<br/>
                  <span style={{color:C.text}}>② EAN-13</span> — scan barcode besar 13 digit. Gunakan tab <b>EAN↔SKU</b> untuk mapping.
                </div>
              </div>
              <div style={{marginBottom:14}}>
                {!camActive?(
                  <button onClick={startCamera} style={{width:"100%",padding:11,borderRadius:10,background:C.blueDim,border:`1px solid ${C.blue}55`,color:C.blue,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>📸 Scan via Kamera (EAN-13)</button>
                ):(
                  <div style={{position:"relative",borderRadius:12,overflow:"hidden",background:"#000"}}>
                    <video ref={videoRef} autoPlay playsInline muted style={{width:"100%",maxHeight:180,objectFit:"cover",display:"block"}}/>
                    <div style={{position:"absolute",left:"8%",right:"8%",height:2,background:`linear-gradient(90deg,transparent,${C.accent},transparent)`,boxShadow:`0 0 8px ${C.accentGlow}`,animation:"scanLine 2s ease-in-out infinite",pointerEvents:"none"}}/>
                    <div style={{position:"absolute",bottom:6,left:0,right:0,textAlign:"center",fontSize:11,color:C.accent,fontWeight:700,animation:"pulse 1.5s ease-in-out infinite",pointerEvents:"none"}}>● Mendeteksi barcode…</div>
                    <button onClick={stopCamera} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.65)",color:"#fff",border:"none",borderRadius:6,padding:"4px 9px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>✕</button>
                  </div>
                )}
              </div>
              <input ref={scanRef} value={scanInput} onChange={e=>setScanInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleScan()}
                placeholder="SKU (8 digit) atau EAN-13"
                style={{width:"100%",padding:"14px 16px",borderRadius:10,background:C.surfaceHigh,border:`2px solid ${C.accent}`,color:C.text,fontSize:20,fontFamily:"monospace",textAlign:"center",outline:"none",letterSpacing:2,boxSizing:"border-box"}}/>
              <div style={{display:"flex",gap:10,marginTop:14}}>
                <button onClick={handleScan} style={{flex:1,background:C.accent,color:"#fff",border:"none",borderRadius:10,padding:13,fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>CARI</button>
                <button onClick={()=>{setScanMode(false);setScanInput("");}} style={{flex:1,background:C.surfaceHigh,color:C.textMuted,border:`1px solid ${C.border}`,borderRadius:10,padding:13,fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>Batal</button>
              </div>
            </div>
          </div>
        )}

        <DetailSheet item={selected} onClose={()=>setSelected(null)}/>
      </>
    );
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // TAB: UPLOAD DATA
  // ═══════════════════════════════════════════════════════════════════════════
  function UploadTab({onDataLoaded,currentData,sessions}) {
    const [dragOver,setDragOver]   = useState(false);
    const [fileStates,setFileStates]= useState([]);
    const [preview,setPreview]     = useState(null);
    const [mode,setMode]           = useState("replace");
    const fileRef=useRef();

    function setFileStatus(i,patch){setFileStates(prev=>prev.map((fs,j)=>j===i?{...fs,...patch}:fs));}

    async function processFiles(files){
      const xlFiles=Array.from(files).filter(f=>f.name.match(/\.(xlsx|xls)$/i));
      if(xlFiles.length===0){alert("Tidak ada file .xlsx / .xls.");return;}
      setPreview(null);
      const initial=xlFiles.map(f=>({file:f,status:"pending",result:null,error:null}));
      setFileStates(initial);
      const results=await Promise.all(xlFiles.map(async(file,idx)=>{
        setFileStatus(idx,{status:"processing"});
        try{const parsed=await parseExcelFile(file);setFileStatus(idx,{status:"done",result:parsed});return{ok:true,file,parsed};}
        catch(err){setFileStatus(idx,{status:"error",error:err.message});return{ok:false,file,error:err.message};}
      }));
      const allValid=[],allSkipped=[],fileNames=[];
      results.forEach(r=>{if(!r.ok)return;fileNames.push(r.file.name);allValid.push(...r.parsed.rows.filter(row=>row._errors.length===0));allSkipped.push(...(r.parsed.sheetSkipped||[]));});
      const skuMap=new Map();allValid.forEach(row=>skuMap.set(row.sku,row));
      const deduped=Array.from(skuMap.values());
      const curSet=new Set(currentData.map(d=>d.sku));
      const brands={};deduped.forEach(r=>{brands[r.brand]=(brands[r.brand]||0)+1;});
      const sheets=new Set(deduped.map(r=>r._sheet));
      setPreview({rows:deduped,sheetSkipped:allSkipped,duplicates:deduped.filter(r=>curSet.has(r.sku)),intraDups:allValid.length-deduped.length,brands,fileCount:results.filter(r=>r.ok).length,fileNames,sheetCount:sheets.size});
    }

    function handleDrop(e){e.preventDefault();setDragOver(false);processFiles(e.dataTransfer.files);}

    function handleImport(){
      if(!preview||preview.rows.length===0)return;
      const finalData=mode==="replace"?preview.rows:[...currentData.filter(d=>!new Set(preview.rows.map(r=>r.sku)).has(d.sku)),...preview.rows];
      const session={id:Date.now(),filename:preview.fileCount>1?`${preview.fileCount} file (${preview.fileNames[0]}…)`:preview.fileNames[0]||"—",date:new Date().toISOString(),mode,count:preview.rows.length,brands:preview.brands,fileCount:preview.fileCount};
      const newSessions=[session,...sessions].slice(0,10);
      store.set(SK_SESSIONS,newSessions);
      store.set(SK_DATA,finalData.map(({_errors,_warnings,_sheet,_row,description,...clean})=>clean));
      onDataLoaded(finalData,newSessions);
      setFileStates([]);setPreview(null);
    }

    const isProcessing=fileStates.some(fs=>fs.status==="processing");
    const doneCount=fileStates.filter(fs=>fs.status==="done").length;
    const errCount=fileStates.filter(fs=>fs.status==="error").length;

    return(
      <div style={{padding:"0 16px 90px",display:"flex",flexDirection:"column",gap:14}}>
        {/* Drop zone */}
        <div onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={handleDrop} onClick={()=>fileRef.current?.click()}
          style={{border:`2px dashed ${dragOver?C.accent:C.border}`,borderRadius:14,padding:"32px 20px",textAlign:"center",cursor:"pointer",background:dragOver?C.accentDim:C.surface,transition:"all 0.2s"}}>
          <div style={{fontSize:38,marginBottom:8}}>{isProcessing?"⏳":"📂"}</div>
          <div style={{fontWeight:700,color:C.text,fontSize:15,marginBottom:5}}>{isProcessing?`Memproses ${fileStates.length} file...`:"Drop file .xlsx di sini"}</div>
          <div style={{color:C.textMuted,fontSize:12}}>atau klik untuk pilih &nbsp;·&nbsp;<span style={{color:C.accent,fontWeight:700}}>Bisa pilih banyak sekaligus</span></div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls" multiple style={{display:"none"}} onChange={e=>e.target.files.length>0&&processFiles(e.target.files)}/>
        </div>

        {/* File list */}
        {fileStates.length>0&&(
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:C.textMuted}}>
                FILE &nbsp;<span style={{color:C.green}}>{doneCount} selesai</span>
                {errCount>0&&<span style={{color:C.accent}}> · {errCount} error</span>}
                {isProcessing&&<span style={{color:C.yellow}}> · memproses…</span>}
              </div>
              {!isProcessing&&<button onClick={()=>{setFileStates([]);setPreview(null);}} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"3px 10px",fontSize:11,color:C.textMuted,cursor:"pointer",fontFamily:"inherit"}}>Hapus semua</button>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {fileStates.map((fs,idx)=>(
                <div key={idx} style={{display:"flex",alignItems:"center",gap:10,background:fs.status==="error"?C.accentDim:C.surfaceHigh,border:`1px solid ${fs.status==="error"?C.accent+"44":fs.status==="done"?C.green+"33":C.border}`,borderRadius:9,padding:"9px 12px"}}>
                  <span>{fs.status==="processing"?"⏳":fs.status==="done"?"✅":fs.status==="error"?"❌":"⏸"}</span>
                  <div style={{flex:1,overflow:"hidden"}}>
                    <div style={{fontSize:12,fontWeight:600,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fs.file.name}</div>
                    {fs.status==="done"&&<div style={{fontSize:10,color:C.textMuted,marginTop:2}}>{fs.result?.rows.filter(r=>r._errors.length===0).length} SKU valid</div>}
                    {fs.status==="error"&&<div style={{fontSize:10,color:C.accent,marginTop:2}}>{fs.error}</div>}
                  </div>
                  {!isProcessing&&<button onClick={e=>{e.stopPropagation();setFileStates(prev=>prev.filter((_,i)=>i!==idx));}} style={{background:"none",border:"none",color:C.textMuted,cursor:"pointer",fontSize:14,padding:"2px 6px",flexShrink:0}}>✕</button>}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Preview */}
        {preview&&!isProcessing&&(
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
              <div style={{fontWeight:700,color:C.text,fontSize:14,marginBottom:4}}>📋 Gabungan {preview.fileCount} file</div>
              {preview.fileNames.slice(0,2).map((fn,i)=><div key={i} style={{fontSize:10,color:C.textMuted}}>• {fn.length>50?fn.slice(0,50)+"…":fn}</div>)}
              {preview.fileNames.length>2&&<div style={{fontSize:10,color:C.textMuted}}>…dan {preview.fileNames.length-2} lainnya</div>}
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginTop:14}}>
                {[["TOTAL SKU",preview.rows.length,C.green],["SHEET",preview.sheetCount,C.blue],["DUPLIKAT",preview.duplicates.length,C.yellow]].map(([l,v,c])=>(
                  <div key={l} style={{background:C.surfaceHigh,borderRadius:10,padding:12,textAlign:"center",border:`1px solid ${v>0&&l==="DUPLIKAT"?c+"44":C.border}`}}>
                    <div style={{fontSize:24,fontWeight:900,color:c}}>{v.toLocaleString("id-ID")}</div>
                    <div style={{fontSize:10,color:C.textMuted,fontWeight:700}}>{l}</div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
              <div style={{fontSize:11,fontWeight:700,color:C.textMuted,marginBottom:10}}>BRAND</div>
              {Object.entries(preview.brands).sort((a,b)=>b[1]-a[1]).map(([brand,count])=>{const pct=Math.round(count/preview.rows.length*100);const clr=BRAND_COLOR[brand]||C.blue;return(
                <div key={brand} style={{marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{color:C.text,fontSize:12,fontWeight:600}}>{brand}</span><span style={{color:C.textMuted,fontSize:12}}>{count.toLocaleString()} · {pct}%</span></div>
                  <div style={{height:4,background:C.surfaceHigh,borderRadius:9999}}><div style={{width:`${pct}%`,height:"100%",background:clr,borderRadius:9999,transition:"width 0.4s ease"}}/></div>
                </div>
              );})}
            </div>
            {preview.sheetSkipped?.length>0&&(
              <div style={{background:C.surfaceHigh,border:`1px solid ${C.border}`,borderRadius:12,padding:14}}>
                <div style={{fontWeight:700,color:C.textMuted,fontSize:12,marginBottom:8}}>ℹ️ {preview.sheetSkipped.length} Sheet di-skip</div>
                {preview.sheetSkipped.map((e,i)=><div key={i} style={{fontSize:11,color:C.textMuted,marginBottom:3}}>• {e}</div>)}
              </div>
            )}
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
              <div style={{fontSize:12,fontWeight:700,color:C.textMuted,marginBottom:10}}>MODE IMPORT</div>
              {[["replace","🔄 Ganti Semua","Hapus data lama, ganti dengan file ini."],["merge","➕ Gabungkan","Tambahkan ke data yang ada."]].map(([val,label,desc])=>(
                <div key={val} onClick={()=>setMode(val)} style={{padding:"12px 14px",borderRadius:10,cursor:"pointer",border:`2px solid ${mode===val?C.accent:C.border}`,background:mode===val?C.accentDim:C.surfaceHigh,marginBottom:8,transition:"all 0.15s"}}>
                  <div style={{fontWeight:700,color:mode===val?C.accent:C.text,fontSize:13,marginBottom:2}}>{label}</div>
                  <div style={{fontSize:11,color:C.textMuted}}>{desc}</div>
                </div>
              ))}
            </div>
            <button onClick={handleImport} disabled={preview.rows.length===0} style={{width:"100%",padding:16,borderRadius:12,border:"none",background:preview.rows.length>0?C.accent:C.surfaceHigh,color:preview.rows.length>0?"#fff":C.textMuted,fontWeight:900,fontSize:15,cursor:preview.rows.length>0?"pointer":"not-allowed",fontFamily:"inherit",boxShadow:preview.rows.length>0?`0 4px 20px ${C.accentGlow}`:"none",transition:"all 0.2s"}}>
              {mode==="replace"?"🔄":"➕"} Import {preview.rows.length.toLocaleString()} SKU dari {preview.fileCount} file
            </button>
            <button onClick={()=>{setFileStates([]);setPreview(null);}} style={{width:"100%",padding:12,borderRadius:12,background:"none",border:`1px solid ${C.border}`,color:C.textMuted,cursor:"pointer",fontFamily:"inherit",fontSize:13}}>Batal</button>
          </div>
        )}

        {/* Session history */}
        {sessions.length>0&&!preview&&fileStates.length===0&&(
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
            <div style={{fontSize:11,fontWeight:700,color:C.textMuted,marginBottom:12,letterSpacing:"0.08em"}}>RIWAYAT UPLOAD</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {sessions.map(s=>(
                <div key={s.id} style={{padding:"10px 12px",background:C.surfaceHigh,borderRadius:8,border:`1px solid ${C.border}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{fontWeight:600,color:C.text,fontSize:12,flex:1,marginRight:8}}>{s.filename}</div>
                    <span style={{background:s.mode==="replace"?C.accentDim:C.greenDim,color:s.mode==="replace"?C.accent:C.green,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:9999}}>{s.mode==="replace"?"GANTI":"GABUNG"}</span>
                  </div>
                  <div style={{fontSize:11,color:C.textMuted,marginTop:4}}>{s.count?.toLocaleString()} SKU · {new Date(s.date).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        {sessions.length===0&&!preview&&fileStates.length===0&&<div style={{textAlign:"center",padding:"20px",color:C.textMuted,fontSize:13}}>Belum ada upload. Drop file .xlsx untuk mulai.</div>}
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // TAB: EAN ↔ SKU MAPPER
  // ═══════════════════════════════════════════════════════════════════════════
  function EanTab({showToast}) {
    const [mapping,setMapping]       = useState(()=>store.get(SK_EANMAP,{}));
    const [eanHist,setEanHist]       = useState(()=>store.get(SK_EANHIST,[]));
    const [ean,setEan]               = useState("");
    const [sku,setSku]               = useState("");
    const [desc,setDesc]             = useState("");
    const [subTab,setSubTab]         = useState("input"); // input | list | export
    const [search,setSearch]         = useState("");
    const [camOn,setCamOn]           = useState(false);
    const [camTarget,setCamTarget]   = useState("ean");
    const [delConfirm,setDelConfirm] = useState(null);
    const videoRef=useRef(),eanRef=useRef(),skuRef=useRef(),readerRef=useRef(null),importRef=useRef();

    useEffect(()=>store.set(SK_EANMAP,mapping),[mapping]);
    useEffect(()=>store.set(SK_EANHIST,eanHist),[eanHist]);

    function eanSt(s){const d=s.replace(/\D/g,"");if(!d.length)return null;if(d.length<8)return{ok:false,msg:"Terlalu pendek"};if(d.length>13)return{ok:false,msg:"Terlalu panjang"};if(d.length<13)return{ok:null,msg:`${d.length}/13`};if(isValidEAN13(d))return{ok:true,msg:"EAN-13 valid ✓"};return{ok:false,msg:"Check digit salah"};}

    function startCamera(target){if(!window.ZXing){showToast("ZXing belum siap","err");return;}setCamTarget(target);setCamOn(true);}
    function stopCamera(){if(readerRef.current){try{readerRef.current.reset();}catch{}readerRef.current=null;}setCamOn(false);}

    useEffect(()=>{
      if(!camOn||!videoRef.current)return;
      const reader=new window.ZXing.BrowserMultiFormatReader();readerRef.current=reader;
      reader.decodeFromVideoDevice(undefined,videoRef.current,(result)=>{
        if(!result)return;const raw=result.getText().replace(/\D/g,"");
        reader.reset();readerRef.current=null;setCamOn(false);
        if(camTarget==="ean"){setEan(raw);setTimeout(()=>skuRef.current?.focus(),100);}else setSku(raw);
        showToast(`Terbaca: ${raw}`,"ok");
      }).catch(()=>setCamOn(false));
      return()=>{try{reader.reset();}catch{}readerRef.current=null;};
    },[camOn]);

    function handleSave(){
      const ce=ean.replace(/\D/g,""),cs=sku.replace(/\D/g,"");
      if(ce.length<8){showToast("EAN minimal 8 digit","err");eanRef.current?.focus();return;}
      if(cs.length<4){showToast("SKU minimal 4 digit","err");skuRef.current?.focus();return;}
      const isEdit=!!mapping[ce];
      const entry={sku:cs,desc:desc.trim(),date:today()};
      setMapping(prev=>({...prev,[ce]:entry}));
      setEanHist(prev=>[{ean:ce,sku:cs,desc:desc.trim(),date:today(),action:isEdit?"edit":"add"},...prev.filter(h=>h.ean!==ce)].slice(0,50));
      showToast(isEdit?`EAN ${ce} diperbarui ✓`:"Mapping disimpan ✓","ok");
      setEan("");setSku("");setDesc("");setTimeout(()=>eanRef.current?.focus(),50);
    }

    function handleDelete(eanKey){const m={...mapping};delete m[eanKey];setMapping(m);setDelConfirm(null);showToast(`EAN ${eanKey} dihapus`,"warn");}

    async function handleImport(file){
      try{const imp=await importEanXLSX(file);const count=Object.keys(imp).length;if(!count){showToast("Tidak ada data valid","err");return;}setMapping(prev=>({...prev,...imp}));showToast(`${count} mapping diimport ✓`,"ok");}
      catch{showToast("Gagal baca file","err");}
    }

    const totalCount=Object.keys(mapping).length;
    const entries=useMemo(()=>{const q=search.trim().toLowerCase();return Object.entries(mapping).filter(([e,v])=>!q||e.includes(q)||v.sku.includes(q)||(v.desc||"").toLowerCase().includes(q)).sort((a,b)=>(b[1].date||"").localeCompare(a[1].date||""));},[mapping,search]);
    const existEntry=mapping[ean.replace(/\D/g,"")];
    const st=eanSt(ean);
    const cleanEan=ean.replace(/\D/g,"");
    const cleanSku=sku.replace(/\D/g,"");
    const canSave=cleanEan.length>=8&&cleanSku.length>=4;

    return(
      <div style={{paddingBottom:90}}>
        <CameraOverlay active={camOn} label={`SCAN ${camTarget==="ean"?"EAN-13 (barcode label)":"SKU (barcode internal)"}`} videoRef={videoRef} onStop={stopCamera}/>

        {/* Sub-tabs */}
        <div style={{display:"flex",gap:0,borderBottom:`1px solid ${C.border}`,padding:"0 16px"}}>
          {[["input","＋ Input"],["list",`☰ Daftar${totalCount>0?` (${totalCount})`:""}`],["export","⬆ Export"]].map(([k,l])=>(
            <button key={k} onClick={()=>setSubTab(k)} style={{flex:1,padding:"11px 0",border:"none",cursor:"pointer",background:"transparent",color:subTab===k?C.teal:C.textMuted,fontWeight:subTab===k?700:500,fontSize:12,borderBottom:`2px solid ${subTab===k?C.teal:"transparent"}`,fontFamily:"inherit",transition:"all 0.15s"}}>{l}</button>
          ))}
        </div>

        {/* INPUT SUB-TAB */}
        {subTab==="input"&&(
          <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:14}}>
            {/* EAN field */}
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <label style={{fontSize:11,fontWeight:700,color:C.textMuted,letterSpacing:"0.08em"}}>EAN-13 / BARCODE LABEL</label>
                {st&&<span style={{fontSize:10,fontWeight:700,color:st.ok===true?C.teal:st.ok===false?C.accent:C.yellow}}>{st.msg}</span>}
              </div>
              <div style={{display:"flex",gap:8}}>
                <input ref={eanRef} value={ean} onChange={e=>setEan(e.target.value.replace(/\D/g,"").slice(0,13))} onKeyDown={e=>e.key==="Enter"&&skuRef.current?.focus()}
                  placeholder="2340002521652" maxLength={13}
                  style={{flex:1,padding:"14px 16px",borderRadius:10,background:C.surfaceHigh,border:`2px solid ${st?.ok===true?C.teal:st?.ok===false?C.accent:C.border}`,color:C.text,fontSize:18,fontFamily:C.mono,letterSpacing:2,outline:"none",transition:"border-color 0.15s"}}/>
                <button onClick={()=>startCamera("ean")} style={{background:C.tealDim,border:`1px solid ${C.teal}44`,borderRadius:10,padding:"0 14px",cursor:"pointer",fontSize:20,color:C.teal,flexShrink:0}}>📷</button>
              </div>
              {existEntry&&<div style={{marginTop:8,padding:"8px 12px",background:C.yellowDim,border:`1px solid ${C.yellow}33`,borderRadius:8,fontSize:11,color:C.yellow}}>⚠️ EAN ini sudah dipetakan ke SKU <span style={{fontFamily:C.mono,fontWeight:700}}>{existEntry.sku}</span>. Simpan untuk update.</div>}
            </div>

            {/* SKU field */}
            <div>
              <label style={{fontSize:11,fontWeight:700,color:C.textMuted,letterSpacing:"0.08em",display:"block",marginBottom:8}}>SKU INTERNAL (dari Excel promo)</label>
              <div style={{display:"flex",gap:8}}>
                <input ref={skuRef} value={sku} onChange={e=>setSku(e.target.value.replace(/\D/g,"").slice(0,12))} onKeyDown={e=>e.key==="Enter"&&handleSave()}
                  placeholder="68071923" maxLength={12}
                  style={{flex:1,padding:"14px 16px",borderRadius:10,background:C.surfaceHigh,border:`2px solid ${cleanSku.length>=4?C.blue+"88":C.border}`,color:C.text,fontSize:18,fontFamily:C.mono,letterSpacing:2,outline:"none",transition:"border-color 0.15s"}}/>
                <button onClick={()=>startCamera("sku")} style={{background:C.blueDim,border:`1px solid ${C.blue}44`,borderRadius:10,padding:"0 14px",cursor:"pointer",fontSize:20,color:C.blue,flexShrink:0}}>📷</button>
              </div>
            </div>

            {/* Deskripsi */}
            <div>
              <label style={{fontSize:11,fontWeight:700,color:C.textMuted,letterSpacing:"0.08em",display:"block",marginBottom:8}}>DESKRIPSI <span style={{color:C.textDim,fontWeight:400}}>(opsional)</span></label>
              <input value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSave()}
                placeholder="mis: SS T-SHIRT TAKE IT EASY · PINK · 3+"
                style={{width:"100%",padding:"12px 16px",borderRadius:10,background:C.surfaceHigh,border:`1px solid ${C.border}`,color:C.text,fontSize:13,outline:"none",fontFamily:"inherit"}}/>
            </div>

            {/* Cara pakai */}
            <div style={{background:C.surfaceHigh,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px"}}>
              <div style={{fontSize:11,fontWeight:700,color:C.textMuted,marginBottom:10,letterSpacing:"0.06em"}}>💡 CARA PAKAI</div>
              {[["①","Scan barcode besar EAN-13 di label fisik dengan 📷"],["②","Ketik SKU 8 digit dari file Excel promo"],["③","Simpan. Ulangi untuk setiap produk."],["④","Export lalu upload ke PromoFinder — scan EAN-13 akan langsung cocok"]].map(([n,t])=>(
                <div key={n} style={{display:"flex",gap:10,marginBottom:8,alignItems:"flex-start"}}>
                  <span style={{fontFamily:C.mono,color:C.teal,fontWeight:700,fontSize:12,flexShrink:0,marginTop:1}}>{n}</span>
                  <span style={{fontSize:12,color:C.textMuted,lineHeight:1.5}}>{t}</span>
                </div>
              ))}
            </div>

            <button onClick={handleSave} disabled={!canSave} style={{width:"100%",padding:16,borderRadius:12,border:"none",background:canSave?C.teal:C.surfaceHigh,color:canSave?"#000":C.textMuted,fontWeight:900,fontSize:15,cursor:canSave?"pointer":"not-allowed",fontFamily:"inherit",boxShadow:canSave?`0 4px 20px ${C.tealGlow}`:"none",transition:"all 0.2s"}}>
              {existEntry?"🔄 UPDATE MAPPING":"✓ SIMPAN MAPPING"}
            </button>

            {/* Recent history */}
            {eanHist.length>0&&(
              <div>
                <div style={{fontSize:11,fontWeight:700,color:C.textMuted,letterSpacing:"0.06em",marginBottom:10}}>RIWAYAT TERAKHIR</div>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  {eanHist.slice(0,5).map((h,i)=>(
                    <div key={i} onClick={()=>{setEan(h.ean);setSku(h.sku);setDesc(h.desc||"");}} style={{display:"flex",alignItems:"center",gap:12,background:C.surface,border:`1px solid ${C.border}`,borderRadius:9,padding:"9px 12px",cursor:"pointer",transition:"border-color 0.15s"}}
                      onMouseEnter={e=>e.currentTarget.style.borderColor=C.teal+"44"}
                      onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                      <div style={{flex:1,overflow:"hidden"}}>
                        <div style={{fontFamily:C.mono,fontSize:11,color:C.textMuted}}>{h.ean}</div>
                        <div style={{fontFamily:C.mono,fontSize:13,fontWeight:700,color:C.teal}}>{h.sku}</div>
                        {h.desc&&<div style={{fontSize:10,color:C.textMuted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.desc}</div>}
                      </div>
                      <span style={{fontSize:9,color:h.action==="edit"?C.yellow:C.teal,fontWeight:700,background:h.action==="edit"?C.yellowDim:C.tealDim,padding:"2px 7px",borderRadius:9999}}>{h.action==="edit"?"EDIT":"BARU"}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* LIST SUB-TAB */}
        {subTab==="list"&&(
          <div style={{padding:16}}>

  // GOOGLE DRIVE SYNC
  // Mengubah link Drive "share" → direct download URL, lalu fetch JSON.
  // Admin export JSON → upload ke Drive → share link → paste di Pengaturan.
  // Semua device karyawan fetch dari link yang sama saat login.
  // ═══════════════════════════════════════════════════════════════════════════
  const SK_DRIVE_LINK  = "pf_drive_link_v1";   // URL drive yang disimpan admin
  const SK_DRIVE_CACHE = "pf_drive_cache_v1";  // { ts, data, sessions, eanMap }
  const DRIVE_CACHE_TTL = 30 * 60 * 1000;      // cache 30 menit

  function driveShareToDownload(url) {
    // Berbagai format link Google Drive → direct download
    // Format 1: https://drive.google.com/file/d/FILE_ID/view?...
    let m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
    if (m) return "https://drive.google.com/uc?export=download&id=" + m[1];
    // Format 2: https://drive.google.com/open?id=FILE_ID
    m = url.match(/[?&]id=([\w-]+)/);
    if (m) return "https://drive.google.com/uc?export=download&id=" + m[1];
    // Format 3: sudah berupa direct download
    if (url.includes("uc?export=download")) return url;
    return null;
  }

  async function fetchDriveData(driveUrl) {
    const dlUrl = driveShareToDownload(driveUrl);
    if (!dlUrl) throw new Error("Format link Drive tidak dikenali");
    const res = await fetch(dlUrl, { cache: "no-store" });
    if (!res.ok) throw new Error(`Gagal fetch (${res.status}). Pastikan file publik.`);
    const payload = await res.json();
    if (!payload.version || !payload.version.startsWith("pf_backup"))
      throw new Error("Format file tidak dikenali. Export ulang dari PromoFinder.");
    return payload;
  }

  async function syncFromDrive(driveUrl, force = false) {
    // Cek cache dulu (kecuali force refresh)
    if (!force) {
      const cached = store.get(SK_DRIVE_CACHE, null);
      if (cached && Date.now() - cached.ts < DRIVE_CACHE_TTL) {
        return { ...cached, fromCache: true };
      }
    }
    const payload = await fetchDriveData(driveUrl);
    const cacheEntry = { ts: Date.now(), data: payload.data, sessions: payload.sessions, eanMap: payload.eanMap || {} };
    store.set(SK_DRIVE_CACHE, cacheEntry);
    return { ...cacheEntry, fromCache: false };
  }

  function exportAsBackup(data, sessions) {
    const eanMap = store.get(SK_EANMAP, {});
    const payload = {
      version: "pf_backup_v1",
      exportedAt: new Date().toISOString(),
      data,
      sessions,
      eanMap,
    };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "promofinder-data-" + today() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // Derive accent-based color variants from hex
  function hexToRgb(hex) {
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return {r,g,b};
  }
  function accentVars(hex) {
    const {r,g,b}=hexToRgb(hex);
    return {
      accent:    hex,
      accentDim: `rgba(${r},${g},${b},0.12)`,
      accentGlow:`rgba(${r},${g},${b},0.28)`,
    };
  }

  // User: auto-sync dari Drive saat login
  function DriveSyncBanner({ onSynced, showToast }) {
    const [status, setStatus] = useState("idle"); // idle|syncing|done|err|nolink
    const [msg, setMsg]       = useState("");

    useEffect(()=>{
      const driveUrl = store.get(SK_DRIVE_LINK,"");
      if (!driveUrl) { setStatus("nolink"); return; }
      setStatus("syncing");
      syncFromDrive(driveUrl)
        .then(result=>{
          store.set(SK_DATA, result.data||[]);
          if(result.eanMap) store.set(SK_EANMAP, result.eanMap);
          onSynced(result.data||[], result.sessions||[], result.eanMap||{});
          setStatus(result.fromCache?"done":"done");
          setMsg(result.fromCache
            ? "Data dari cache lokal (" + (result.data?.length||0) + " SKU)"
            : "Sync berhasil: " + (result.data?.length||0) + " SKU diperbarui");
        })
        .catch(e=>{
          setStatus("err");
          setMsg("Sync gagal: " + e.message + ". Menggunakan data lokal.");
        });
    },[]);

    if (status==="idle") return null;

    const clr   = status==="syncing"?C.yellow:status==="err"?C.accent:status==="nolink"?C.textMuted:C.green;
    const bgClr = status==="syncing"?C.yellowDim:status==="err"?C.accentDim:status==="nolink"?"transparent":C.greenDim;
    const icon  = status==="syncing"?"⏳":status==="err"?"⚠️":status==="nolink"?"📭":"✓";
    const label = status==="syncing"?"Mengambil data promo terbaru…":status==="nolink"?"Admin belum setup Drive sync":msg;

    return (
      <div style={{ margin:"12px 16px 0", background:bgClr, border:`1px solid ${clr}33`, borderRadius:10, padding:"10px 14px", display:"flex", alignItems:"center", gap:10 }}>
        <span style={{ fontSize:16, flexShrink:0 }}>{icon}</span>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12, color:clr, fontWeight:700, lineHeight:1.4 }}>{label}</div>
          {status==="err"&&<div style={{ fontSize:10, color:C.textMuted, marginTop:2 }}>Cek koneksi internet atau minta admin update link Drive.</div>}
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════════════════
  function PinScreen({ onLogin, theme }) {
    const [role,   setRole]   = useState("user");   // "user" | "admin"
    const [pin,    setPin]    = useState("");
    const [shake,  setShake]  = useState(false);
    const [hint,   setHint]   = useState(null);
    const ac = theme.accent;

    function handleDigit(d) {
      if (pin.length >= 8) return;
      const next = pin + d;
      setPin(next);
      // Auto-submit when length matches stored PIN
      const cfg = getAuthCfg();
      const target = role === "admin" ? cfg.adminPin : cfg.userPin;
      if (next.length >= target.length) {
        setTimeout(() => tryLogin(next, role), 80);
      }
    }

    function tryLogin(p, r) {
      const cfg = getAuthCfg();
      const target = r === "admin" ? cfg.adminPin : cfg.userPin;
      if (p === target) {
        saveSession(r);
        onLogin(r);
      } else {
        setShake(true);
        setPin("");
        setHint("PIN salah, coba lagi");
        setTimeout(() => { setShake(false); setHint(null); }, 600);
      }
    }

    function handleDel() { setPin(p => p.slice(0, -1)); setHint(null); }

    const DIGITS = ["1","2","3","4","5","6","7","8","9","","0","⌫"];

    return (
      <div style={{ minHeight:"100vh", background:C.bg, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24 }}>
        <div style={{ width:"100%", maxWidth:320, display:"flex", flexDirection:"column", alignItems:"center", gap:0 }}>

          <div style={{ fontSize:11, color:C.textMuted, letterSpacing:"0.08em", marginBottom:32 }}>RETAIL PROMO LOOKUP</div>

              <button key={r} onClick={()=>{setRole(r);setPin("");setHint(null);}} style={{
                flex:1, padding:"10px 0", borderRadius:9, border:"none", cursor:"pointer",

                fontWeight: role===r ? 800 : 500, fontSize:13, fontFamily:"inherit",

            {Array.from({length: Math.max(4, pin.length)}).map((_,i)=>(
              <div key={i} style={{
                width:14, height:14, borderRadius:"50%",
                background: i < pin.length ? (role==="admin"?ac:C.green) : C.border,
                transition:"background 0.15s, transform 0.1s",
                transform: i < pin.length ? "scale(1.2)" : "scale(1)",
                boxShadow: i < pin.length ? `0 0 8px ${role==="admin"?ac:C.green}66` : "none",
              }}/>
            ))}
          </div>
          <div style={{ height:20, marginBottom:20, fontSize:12, color:hint?C.accent:C.textMuted, fontWeight:hint?700:400 }}>
            {hint || (role==="admin" ? "Masukkan PIN Admin" : "Masukkan PIN Karyawan")}
          </div>

          {/* Numpad */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, width:"100%" }}>

                  style={{
                    padding:"18px 0", borderRadius:14, border:`1px solid ${C.border}`,
                    background: isDel ? "transparent" : C.surface,
                    color: isDel ? C.textMuted : C.text,
