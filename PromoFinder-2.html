            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-8px)}
            40%{transform:translateX(8px)}
            60%{transform:translateX(-6px)}
            80%{transform:translateX(6px)}
          }
        `}</style>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // CUSTOMIZE TAB (Admin only)
  // ═══════════════════════════════════════════════════════════════════════════
  function CustomizeTab({ theme, onThemeChange, onLogout, showToast, data, sessions }) {
    const [appName, setAppName] = useState(theme.appName);
    const [emoji,   setEmoji]   = useState(theme.emoji);
    const [accent,  setAccent]  = useState(theme.accent);
    const [adminPin,setAdminPin]= useState("");
    const [userPin, setUserPin] = useState("");
    const [confirmAdmin, setConfirmAdmin] = useState("");
    const [confirmUser,  setConfirmUser]  = useState("");
    const [pinSection, setPinSection]     = useState(null); // "admin"|"user"|null

    const ACCENT_PRESETS = [
      ["#FF3E5E","Merah"],["#FF6B2B","Oranye"],["#FFB800","Kuning"],
      ["#00D68F","Hijau"],["#00E5A0","Teal"],["#4D8EFF","Biru"],
      ["#A855F7","Ungu"],["#EC4899","Pink"],["#6B7280","Abu"],
    ];

    function handleSaveTheme() {
      const t = { appName: appName.trim()||"PromoFinder", emoji: emoji.trim()||"🏷️", accent };
      saveTheme(t);
      onThemeChange(t);
      showToast("Tampilan disimpan ✓", "ok");
    }

    function handleSavePin(role) {
      const p  = role==="admin" ? adminPin  : userPin;
      const cp = role==="admin" ? confirmAdmin : confirmUser;
      if (p.length < 4)   { showToast("PIN minimal 4 digit", "err"); return; }
      if (p.length > 8)   { showToast("PIN maksimal 8 digit", "err"); return; }
      if (p !== cp)        { showToast("Konfirmasi PIN tidak cocok", "err"); return; }
      const cfg = getAuthCfg();
      if (role==="admin") cfg.adminPin=p; else cfg.userPin=p;
      store.set(SK_AUTH, cfg);
      showToast(`PIN ${role==="admin"?"Admin":"Karyawan"} berhasil diubah ✓`, "ok");
      if (role==="admin") { setAdminPin(""); setConfirmAdmin(""); }
      else                { setUserPin("");  setConfirmUser(""); }
      setPinSection(null);
    }

    function handleResetData() {
      if (!confirm("Hapus semua data promo, riwayat upload, dan mapping EAN? Tindakan ini tidak bisa dibatalkan.")) return;
      [SK_DATA, SK_HIST, SK_SESSIONS, SK_EANMAP, SK_EANHIST].forEach(k => localStorage.removeItem(k));
      showToast("Semua data direset ✓", "warn");
      setTimeout(() => window.location.reload(), 1000);
    }

    return (
      <div style={{ padding:"0 16px 90px", display:"flex", flexDirection:"column", gap:16 }}>

        {/* ── Tampilan Aplikasi ── */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:18 }}>
          <div style={{ fontSize:12, fontWeight:700, color:C.textMuted, letterSpacing:"0.08em", marginBottom:14 }}>🎨 TAMPILAN APLIKASI</div>

          {/* App name */}
          <div style={{ marginBottom:14 }}>
            <label style={{ fontSize:11, fontWeight:700, color:C.textMuted, display:"block", marginBottom:6 }}>NAMA APLIKASI</label>
            <input value={appName} onChange={e=>setAppName(e.target.value)} maxLength={24}
              style={{ width:"100%", padding:"11px 14px", borderRadius:10, background:C.surfaceHigh, border:`1px solid ${C.border}`, color:C.text, fontSize:15, fontWeight:700, outline:"none", fontFamily:"inherit" }}/>
          </div>

          {/* Emoji */}
          <div style={{ marginBottom:14 }}>
            <label style={{ fontSize:11, fontWeight:700, color:C.textMuted, display:"block", marginBottom:6 }}>IKON / EMOJI</label>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {["🏷️","🛍️","💰","🏪","📦","⭐","🎯","🔖","💳"].map(e=>(
                <button key={e} onClick={()=>setEmoji(e)} style={{ width:44, height:44, fontSize:22, borderRadius:10, border:`2px solid ${emoji===e?accent:C.border}`, background:emoji===e?accent+"22":"transparent", cursor:"pointer" }}>{e}</button>
              ))}
            </div>
          </div>

          {/* Accent color */}
          <div style={{ marginBottom:18 }}>
            <label style={{ fontSize:11, fontWeight:700, color:C.textMuted, display:"block", marginBottom:6 }}>WARNA AKSEN</label>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:10 }}>
              {ACCENT_PRESETS.map(([hex,name])=>(
                <button key={hex} onClick={()=>setAccent(hex)} title={name} style={{ width:36, height:36, borderRadius:9, background:hex, border:`3px solid ${accent===hex?"#fff":C.border}`, cursor:"pointer", transition:"transform 0.15s", transform:accent===hex?"scale(1.15)":"scale(1)" }}/>
              ))}
            </div>
            <div style={{ display:"flex", gap:10, alignItems:"center" }}>
              <input type="color" value={accent} onChange={e=>setAccent(e.target.value)} style={{ width:40, height:36, borderRadius:8, border:`1px solid ${C.border}`, background:"none", cursor:"pointer", padding:2 }}/>
              <span style={{ fontFamily:C.mono, fontSize:13, color:accent, fontWeight:700 }}>{accent}</span>
              <div style={{ flex:1, height:10, borderRadius:9999, background:accent, opacity:0.8 }}/>
            </div>
          </div>

          {/* Preview */}
          <div style={{ background:C.surfaceHigh, border:`1px solid ${C.border}`, borderRadius:10, padding:"12px 14px", marginBottom:14 }}>
            <div style={{ fontSize:10, fontWeight:700, color:C.textMuted, marginBottom:8 }}>PREVIEW</div>
            <div style={{ fontWeight:900, fontSize:20, letterSpacing:-0.5 }}>{emoji} {appName||"PromoFinder"}</div>
            <div style={{ marginTop:8, display:"flex", gap:8 }}>
              <span style={{ background:accent+"22", color:accent, border:`1px solid ${accent}44`, fontSize:10, fontWeight:700, padding:"3px 10px", borderRadius:9999 }}>PROMO AKTIF</span>
              <span style={{ background:accent, color:"#fff", fontSize:10, fontWeight:700, padding:"3px 10px", borderRadius:9999 }}>📷 SCAN</span>
            </div>
          </div>

          <button onClick={handleSaveTheme} style={{ width:"100%", padding:14, borderRadius:12, border:"none", background:accent, color:"#fff", fontWeight:800, fontSize:14, cursor:"pointer", fontFamily:"inherit", boxShadow:`0 4px 16px ${accent}44`, transition:"all 0.2s" }}>
            Simpan Tampilan
          </button>
        </div>

        {/* ── Kelola PIN ── */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:18 }}>
          <div style={{ fontSize:12, fontWeight:700, color:C.textMuted, letterSpacing:"0.08em", marginBottom:14 }}>🔑 KELOLA PIN</div>
          {[["admin","PIN Admin (4–8 digit)","#FF3E5E"],["user","PIN Karyawan (4–8 digit)",C.green]].map(([role,label,clr])=>(
            <div key={role} style={{ marginBottom:10 }}>
              <button onClick={()=>setPinSection(pinSection===role?null:role)} style={{ width:"100%", padding:"12px 16px", borderRadius:10, border:`1px solid ${pinSection===role?clr:C.border}`, background:pinSection===role?clr+"11":"transparent", color:pinSection===role?clr:C.text, fontWeight:700, fontSize:13, cursor:"pointer", fontFamily:"inherit", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span>🔐 Ubah {label}</span>
                <span style={{ fontSize:11, color:C.textMuted }}>{pinSection===role?"▲":"▼"}</span>
              </button>
              {pinSection===role&&(
                <div style={{ padding:"14px 14px 4px", background:C.surfaceHigh, borderRadius:"0 0 10px 10px", border:`1px solid ${C.border}`, borderTop:"none", display:"flex", flexDirection:"column", gap:10 }}>
                  <input type="password" inputMode="numeric" value={role==="admin"?adminPin:userPin}
                    onChange={e=>{const v=e.target.value.replace(/\D/g,"").slice(0,8);role==="admin"?setAdminPin(v):setUserPin(v);}}
                    placeholder="PIN baru"
                    style={{ width:"100%", padding:"11px 14px", borderRadius:9, background:C.surface, border:`1px solid ${C.border}`, color:C.text, fontSize:16, fontFamily:C.mono, letterSpacing:4, outline:"none" }}/>
                  <input type="password" inputMode="numeric" value={role==="admin"?confirmAdmin:confirmUser}
                    onChange={e=>{const v=e.target.value.replace(/\D/g,"").slice(0,8);role==="admin"?setConfirmAdmin(v):setConfirmUser(v);}}
                    placeholder="Konfirmasi PIN"
                    onKeyDown={e=>e.key==="Enter"&&handleSavePin(role)}
                    style={{ width:"100%", padding:"11px 14px", borderRadius:9, background:C.surface, border:`1px solid ${C.border}`, color:C.text, fontSize:16, fontFamily:C.mono, letterSpacing:4, outline:"none" }}/>
                  <button onClick={()=>handleSavePin(role)} style={{ padding:"11px", borderRadius:9, border:"none", background:clr, color:"#fff", fontWeight:700, fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>
                    Simpan PIN {role==="admin"?"Admin":"Karyawan"}
                  </button>
                </div>
              )}
            </div>
          ))}
        </div>

        {/* ── Reset Data ── */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:18 }}>
          <div style={{ fontSize:12, fontWeight:700, color:C.textMuted, letterSpacing:"0.08em", marginBottom:14 }}>⚠️ ZONA BAHAYA</div>
          <button onClick={handleResetData} style={{ width:"100%", padding:13, borderRadius:10, background:"rgba(255,62,94,0.08)", border:`1px solid ${C.accent}44`, color:C.accent, fontWeight:700, fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>
            🗑️ Reset Semua Data Promo & EAN
          </button>
          <div style={{ fontSize:11, color:C.textDim, marginTop:8, lineHeight:1.5 }}>
            Menghapus semua data promo, riwayat upload, dan mapping EAN. PIN tidak ikut dihapus.
          </div>
        </div>

        {/* ── Drive Sync Setup ── */}
        <DriveSyncAdmin showToast={showToast}/>

        {/* ── Export Backup ── */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:18 }}>
          <div style={{ fontSize:12, fontWeight:700, color:C.textMuted, letterSpacing:"0.08em", marginBottom:10 }}>💾 EXPORT DATA</div>
          <div style={{ fontSize:12, color:C.textMuted, marginBottom:12, lineHeight:1.5 }}>
            Export data promo + EAN mapping ke file JSON. Upload file ini ke Google Drive lalu paste link-nya di bagian Sync di atas.
          </div>
          <button onClick={()=>exportAsBackup(data||[], sessions||[])} style={{ width:"100%", padding:12, borderRadius:10, border:`1px solid ${C.teal}44`, background:C.tealDim, color:C.teal, fontWeight:700, fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>
            ⬇️ Export Backup JSON
          </button>
        </div>

        {/* ── Logout ── */}
        <button onClick={onLogout} style={{ width:"100%", padding:14, borderRadius:12, background:"transparent", border:`1px solid ${C.border}`, color:C.textMuted, fontWeight:700, fontSize:14, cursor:"pointer", fontFamily:"inherit" }}>
          🚪 Keluar / Ganti Akun
        </button>

      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // ROOT APP — dengan sistem PIN Auth
  // ═══════════════════════════════════════════════════════════════════════════
  function App() {
    const [role,    setRole]    = useState(()=>{ const s=getSession(); return s?s.role:null; });
    const [theme,   setTheme]   = useState(getTheme);
    const [tab,     setTab]     = useState("search");
    const [data,    setData]    = useState(()=>store.get(SK_DATA,[]));
    const [sessions,setSessions]= useState(()=>store.get(SK_SESSIONS,[]));
    const [toast,   setToast]   = useState(null);
    const toastTimer=useRef(null);

    const dynC = useMemo(()=>({...C,...accentVars(theme.accent)}),[theme.accent]);

    function showToast(msg,type="ok"){
      clearTimeout(toastTimer.current);
      setToast({msg,type});
      toastTimer.current=setTimeout(()=>setToast(null),2800);
    }

    function handleLogin(r){ setRole(r); setTab("search"); }
    function handleLogout(){ clearSession(); setRole(null); setTab("search"); }
    function handleThemeChange(t){ setTheme(t); }
    function handleDataLoaded(newData,newSessions){ setData(newData); setSessions(newSessions); setTab("search"); }

    const eanCount=Object.keys(store.get(SK_EANMAP,{})).length;
    const isAdmin = role==="admin";

    const TABS = isAdmin
      ? [
          {id:"search",    icon:theme.emoji, label:"Cari Promo"},
          {id:"upload",    icon:"📂",         label:"Upload"},
          {id:"ean",       icon:"🔗",         label:"EAN↔SKU"},
          {id:"customize", icon:"⚙️",         label:"Pengaturan"},
        ]
      : [
          {id:"search",   icon:theme.emoji, label:"Cari Promo"},
          {id:"logout",   icon:"🚪",         label:"Keluar"},
        ];

    function handleTabChange(id){
      if(id==="logout"){ handleLogout(); return; }
      setTab(id);
    }

    if (!role) return <PinScreen onLogin={handleLogin} theme={theme}/>;

    return(
      <div style={{maxWidth:500,margin:"0 auto",minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'DM Sans',system-ui,sans-serif",position:"relative"}}>

        {/* ── HEADER ── */}
        <div style={{padding:"16px 16px 0",position:"sticky",top:0,zIndex:200,background:C.bg,borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div>
              <div style={{fontWeight:900,fontSize:22,letterSpacing:-0.5,color:C.text}}>
                {theme.emoji} {theme.appName}
                <span style={{fontSize:10,color:C.textMuted,fontWeight:400,marginLeft:8,letterSpacing:"0.06em"}}>v2.3</span>
              </div>
              <div style={{fontSize:10,color:C.textMuted,letterSpacing:"0.06em"}}>RETAIL PROMO LOOKUP · Little M / Matahari</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
              {sessions.length>0&&(
                <div style={{background:C.greenDim,border:`1px solid ${C.green}33`,borderRadius:8,padding:"4px 8px",fontSize:10,color:C.green,fontWeight:700}}>
                  ✓ {sessions[0]?.filename?.slice(0,12)}…
                </div>
              )}
              <div style={{background:isAdmin?dynC.accentDim:C.greenDim,border:`1px solid ${isAdmin?dynC.accent:C.green}33`,borderRadius:8,padding:"3px 8px",fontSize:10,color:isAdmin?dynC.accent:C.green,fontWeight:700}}>
                {isAdmin?"🔐 Admin":"👤 Karyawan"}
              </div>
            </div>
          </div>
        </div>

        {/* ── DRIVE SYNC BANNER (user only, saat pertama load) ── */}
        {!isAdmin && <DriveSyncBanner
          onSynced={(d,s,em)=>{ setData(d); if(s.length) setSessions(s); if(em) store.set(SK_EANMAP,em); }}
          showToast={showToast}
        />}

        {/* ── CONTENT ── */}
        <div style={{paddingTop:12}}>
          {tab==="search"    && <SearchTab data={data} showToast={showToast} dynC={dynC}/>}
          {tab==="upload"    && isAdmin && <UploadTab onDataLoaded={handleDataLoaded} currentData={data} sessions={sessions}/>}
          {tab==="ean"       && isAdmin && <EanTab showToast={showToast}/>}
          {tab==="customize" && isAdmin && <CustomizeTab theme={theme} onThemeChange={handleThemeChange} onLogout={handleLogout} showToast={showToast} data={data} sessions={sessions}/>}
          {!isAdmin && tab!=="search" && <SearchTab data={data} showToast={showToast} dynC={dynC}/>}
        </div>

        {/* ── BOTTOM NAV ── */}
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:500,background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:300,paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
          {TABS.map(({id,icon,label})=>{
            const isActive = tab===id && id!=="logout";
            const showUploadBadge = id==="upload" && sessions.length>0;
            const showEanBadge    = id==="ean"    && eanCount>0;
            return(
              <button key={id} onClick={()=>handleTabChange(id)} style={{flex:1,padding:"12px 0 10px",border:"none",cursor:"pointer",background:"transparent",display:"flex",flexDirection:"column",alignItems:"center",gap:4,position:"relative",fontFamily:"inherit",transition:"all 0.15s"}}>
                <div style={{fontSize:id==="logout"?18:20,lineHeight:1,filter:isActive?"none":"grayscale(0.5) opacity(0.6)"}}>{icon}</div>
                <div style={{fontSize:10,fontWeight:isActive?700:500,color:isActive?dynC.accent:id==="logout"?C.accent:C.textMuted,letterSpacing:"0.02em",transition:"color 0.15s"}}>{label}</div>
                {isActive&&<div style={{position:"absolute",top:0,left:"20%",right:"20%",height:2,background:dynC.accent,borderRadius:"0 0 3px 3px"}}/>}
                {(showUploadBadge||showEanBadge)&&(
                  <div style={{position:"absolute",top:8,right:"22%",background:showEanBadge?C.teal:C.green,color:"#000",fontSize:8,fontWeight:900,minWidth:16,height:16,borderRadius:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px",lineHeight:1}}>
                    {showEanBadge?eanCount:sessions.length}
                  </div>
                )}
              </button>
            );
          })}
        </div>

        <Toast toast={toast}/>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
